spring.application.name=kali-aishah-student-api
server.port=8080

# Personal data shown by GET / and GET /api/info
app.student.name=Kali Aishah
app.student.id=37830
app.version=v1.1

# Database: values come from environment variables (docker-compose / .env).
# The defaults after ":" are used only when running locally without Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kali_aishah_studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kali_aishah}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
